model:
  embedding_dim: 1024
  num_generators: 10
  hidden_dim: 512
  dropout: 0.3

training:
  batch_size: 32
  epochs: 50
  learning_rate: 1e-4
  weight_decay: 1e-2

open_set:
  k_neighbors: 5
  confidence_threshold: 0.5

data:
  sample_rate: 16000
  datasets:
    - DiffSSD
    - SingFake
  generators:
    - glow_tts
    - fastspeech2
    - tacotron2
    - diffusiontext2speech

device: cuda
seed: 42
